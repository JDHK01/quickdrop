<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#171a18" />
    <title>QuickDrop</title>
    <link rel="stylesheet" href="/vendor/filepond/filepond.min.css?v=4.32.12" />
    <link rel="stylesheet" href="/styles.css?v=20261010.1" />
    <script src="/vendor/filepond/filepond.min.js?v=4.32.12" defer></script>
    <script src="/vendor/lucide/lucide.min.js?v=1.26.0" defer></script>
    <script src="/app.js?v=20261010.1" defer></script>
  </head>
  <body>
    <div class="app-view">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/" aria-label="QuickDrop 首页">
            <span class="brand-mark"><i data-lucide="package-open"></i></span>
            <span>QuickDrop</span>
          </a>
          <div class="topbar-actions">
            <span class="service-status"><span class="status-dot"></span>在线</span>
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="workspace-heading" aria-labelledby="library-title">
          <div>
            <p class="eyebrow">RESOURCE LIBRARY</p>
            <h1 id="library-title">资源库</h1>
          </div>
          <div class="stats" aria-label="资源统计">
            <div class="stat">
              <span id="file-count" class="stat-value">0</span>
              <span class="stat-label">资源</span>
            </div>
            <div class="stat">
              <span id="storage-used" class="stat-value">0 B</span>
              <span class="stat-label">已存储</span>
            </div>
            <div class="stat">
              <span class="stat-value">不限</span>
              <span class="stat-label">单文件大小</span>
            </div>
          </div>
        </section>

        <section class="live-preview" aria-labelledby="live-preview-title">
          <div class="live-preview-heading">
            <div>
              <h2 id="live-preview-title">实时预览</h2>
            </div>
            <div class="live-preview-tools">
              <span id="preview-status" class="preview-status" role="status">正在连接</span>
              <button id="preview-copy" class="secondary-button" type="button">
                <i data-lucide="copy"></i>
                复制内容
              </button>
              <button id="preview-clear" class="secondary-button" type="button">
                <i data-lucide="eraser"></i>
                清空
              </button>
            </div>
          </div>
          <div class="live-preview-card">
            <label class="sr-only" for="preview-input">实时预览内容</label>
            <textarea
              id="preview-input"
              maxlength="65536"
              spellcheck="false"
            ></textarea>
            <div class="live-preview-footer">
              <span id="preview-meta">0 字符</span>
              <span>自动同步 · 最多 64K 字符</span>
            </div>
          </div>
        </section>

        <section class="upload-tool" aria-labelledby="upload-title">
          <h2 id="upload-title" class="sr-only">上传资源</h2>
          <input id="file-input" class="filepond" type="file" name="files" multiple />
        </section>

        <section class="resources" aria-labelledby="resources-title">
          <div class="section-toolbar">
            <div>
              <h2 id="resources-title">全部资源</h2>
              <p id="resource-summary">0 个文件</p>
            </div>
            <label class="search-field" for="search-input">
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="search-input" type="search" placeholder="搜索文件名" autocomplete="off" />
              <span class="sr-only">搜索文件名</span>
            </label>
          </div>

          <div id="resource-list" class="resource-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <dialog id="rename-dialog" class="confirm-dialog rename-dialog">
      <form id="rename-form">
        <span class="dialog-icon rename-icon"><i data-lucide="pencil"></i></span>
        <h2>重命名资源</h2>
        <label class="rename-field" for="rename-input">
          <span>文件名</span>
          <input
            id="rename-input"
            type="text"
            maxlength="180"
            autocomplete="off"
            aria-describedby="rename-error"
            required
          />
        </label>
        <p id="rename-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="rename-cancel" class="secondary-button" type="button">取消</button>
          <button id="rename-submit" class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog" class="confirm-dialog">
      <form method="dialog">
        <span class="dialog-icon"><i data-lucide="trash-2"></i></span>
        <h2>删除资源？</h2>
        <p id="delete-filename"></p>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel">取消</button>
          <button id="confirm-delete" class="danger-button" value="confirm">删除</button>
        </div>
      </form>
    </dialog>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
